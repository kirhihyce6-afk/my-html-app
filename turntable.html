<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="크리스탈 턴테이블">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff0f5">
<title>크리스탈 글래스 3D 턴테이블</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
  --aurora-1: rgba(255, 182, 193, 0.45);
  --aurora-2: rgba(186, 225, 255, 0.5);
  --aurora-3: rgba(255, 223, 186, 0.4);
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-border: rgba(255, 255, 255, 0.85);
  --gold-spark: #ffd166;
  --font-hand: 'Nanum Pen Script', 'Gaegu', cursive;
  --font-ui: 'Noto Sans KR', -apple-system, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: var(--font-ui);
  background: #fbfbfe;
  color: #2d3436;
}

/* 화사한 파스텔 오로라 무빙 배경 */
#stage {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  perspective: 1100px;
  perspective-origin: 50% 45%;
  overflow: hidden;
  touch-action: none;
  background: radial-gradient(circle at 50% 30%, #ffffff 0%, #fff4f7 40%, #f0f4ff 85%, #fbe9f2 100%);
}

/* 몽환적인 빛망울(오로라 블러) 배경 장식 */
.aurora-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(65px);
  pointer-events: none;
  opacity: 0.75;
  animation: floatOrb 12s ease-in-out infinite alternate;
}
.orb-1 { width: 340px; height: 340px; background: #ffd1dc; top: 10%; left: 5%; animation-duration: 14s; }
.orb-2 { width: 380px; height: 380px; background: #c7ecee; bottom: 15%; right: 5%; animation-duration: 18s; }
.orb-3 { width: 300px; height: 300px; background: #fdf5e6; top: 35%; right: 20%; animation-duration: 11s; }

@keyframes floatOrb {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(30px, 40px) scale(1.1); }
  100% { transform: translate(-25px, 20px) scale(0.95); }
}

/* 반짝이는 별가루 캔버스 */
#sparkleCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 2;
}

/* 3D 크리스탈 보석 턴테이블 바닥 */
.turntable-crystal-base {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 600px;
  height: 600px;
  margin-left: -300px;
  margin-top: 50px;
  border-radius: 50%;
  transform: rotateX(80deg);
  background: radial-gradient(circle, 
    rgba(255, 255, 255, 0.95) 0%, 
    rgba(255, 220, 240, 0.45) 30%, 
    rgba(215, 235, 255, 0.35) 60%, 
    transparent 74%
  );
  border: 2px solid rgba(255, 255, 255, 0.9);
  box-shadow: 
    0 0 50px rgba(255, 192, 203, 0.5), 
    inset 0 0 45px rgba(186, 225, 255, 0.5);
  pointer-events: none;
}
.turntable-crystal-base::after {
  content: '';
  position: absolute;
  inset: 30px;
  border-radius: 50%;
  border: 1.5px dashed rgba(255, 215, 0, 0.55);
}

/* 3D 회전 컨테이너 */
#carousel {
  position: absolute;
  top: 45%;
  left: 50%;
  width: 0;
  height: 0;
  transform-style: preserve-3d;
  will-change: transform;
  z-index: 10;
}

/* 크리스탈 글래스모피즘 포토 카드 */
.carousel-card {
  position: absolute;
  left: -115px;
  top: -160px;
  width: 230px;
  transform-style: preserve-3d;
  cursor: pointer;
  will-change: transform, opacity;
  transition: opacity 0.25s, filter 0.25s;
}

/* 영롱한 유리 프레임 */
.crystal-card-body {
  width: 100%;
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: 12px 12px 18px 12px;
  border-radius: 20px;
  border: 1.5px solid rgba(255, 255, 255, 0.95);
  box-shadow: 
    0 20px 40px rgba(220, 180, 210, 0.35),
    0 2px 10px rgba(255, 255, 255, 0.8),
    inset 0 1px 2px rgba(255, 255, 255, 1);
  position: relative;
  backface-visibility: hidden;
  transform: translateZ(1px);
  overflow: hidden;
}

/* 빛 반사 하이라이트 줄기 */
.crystal-card-body::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(120deg, transparent 35%, rgba(255,255,255,0.7) 48%, rgba(255,255,255,0.9) 50%, rgba(255,255,255,0.7) 52%, transparent 65%);
  pointer-events: none;
  opacity: 0.85;
}

.card-img-wrap {
  width: 100%;
  aspect-ratio: 1/1;
  background: #f1f2f6;
  overflow: hidden;
  border-radius: 14px;
  position: relative;
  box-shadow: 0 4px 14px rgba(0,0,0,0.06);
}
.card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
  filter: contrast(104%) saturate(106%);
}

.card-caption {
  margin-top: 11px;
  min-height: 34px;
  text-align: center;
  font-family: var(--font-hand);
  font-size: 23px;
  color: #374151;
  line-height: 1.15;
  cursor: text;
  word-break: break-all;
  outline: none;
}
.card-caption:empty:before {
  content: '반짝이는 추억 한 줄... ✨';
  color: #9ca3af;
  font-size: 19px;
}

/* 상단 쥬얼리 보석 핀 */
.card-gem-pin {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffffff 0%, #ff9ff3 45%, #f368e0 100%);
  box-shadow: 0 4px 10px rgba(243, 104, 224, 0.45), 0 0 12px rgba(255, 255, 255, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  border: 1.5px solid #fff;
}

/* 상단 헤더 */
header {
  position: absolute;
  top: calc(12px + var(--safe-top));
  left: 14px;
  right: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 9999;
  pointer-events: none;
}
header * { pointer-events: auto; }

.album-badge-box {
  background: rgba(255, 255, 255, 0.78);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.95);
  padding: 8px 16px;
  border-radius: 24px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(220, 170, 210, 0.28);
}
.album-badge-box .icon { font-size: 18px; }
.album-badge-box .name {
  color: #1e293b;
  font-size: 15px;
  font-weight: 700;
  max-width: 140px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.album-badge-box .count {
  font-size: 11px;
  font-weight: 600;
  color: #e056fd;
  background: rgba(224, 86, 253, 0.12);
  padding: 2px 8px;
  border-radius: 12px;
}

.header-actions {
  display: flex;
  gap: 8px;
}
.header-btn {
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.95);
  color: #374151;
  font-weight: 600;
  border-radius: 20px;
  padding: 8px 14px;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  box-shadow: 0 6px 18px rgba(200, 180, 210, 0.25);
  transition: all 0.18s;
}
.header-btn:active {
  transform: scale(0.93);
  background: #fff;
}

/* 빈 상태 안내 */
#emptyHint {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: #64748b;
  pointer-events: none;
  transition: opacity 0.3s;
  width: 80%;
  z-index: 5;
}
#emptyHint .icon { 
  font-size: 58px; 
  margin-bottom: 12px; 
  display: inline-block;
  animation: gentleBounce 2.5s ease-in-out infinite alternate;
  filter: drop-shadow(0 8px 16px rgba(255, 159, 243, 0.4));
}
#emptyHint p { margin: 4px 0; font-size: 15px; font-weight: 600; color: #475569; }
@keyframes gentleBounce {
  0% { transform: translateY(0) rotate(0deg); }
  100% { transform: translateY(-10px) rotate(4deg); }
}

/* 하단 블링블링 글래스 툴바 */
.toolbar-wrap {
  position: absolute;
  bottom: calc(20px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  z-index: 9999;
}

.nav-controls {
  display: flex;
  align-items: center;
  gap: 16px;
}
.nav-arrow {
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.95);
  color: #ff6b81;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  font-size: 22px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 24px rgba(240, 180, 200, 0.35);
  transition: all 0.16s;
}
.nav-arrow:active {
  transform: scale(0.88);
  background: #ff6b81;
  color: #fff;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  padding: 8px 18px;
  border-radius: 44px;
  box-shadow: 
    0 16px 38px rgba(210, 170, 200, 0.35), 
    0 0 0 1.5px rgba(255, 255, 255, 0.9);
}

.tool-btn {
  border: none;
  background: transparent;
  color: #4b5563;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  padding: 6px 12px;
  border-radius: 16px;
  transition: all 0.16s;
}
.tool-btn .ico { font-size: 21px; }
.tool-btn:active {
  transform: scale(0.9);
  color: #ff4757;
}

.tool-btn.primary {
  background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
  color: #fff;
  padding: 9px 20px;
  border-radius: 28px;
  font-weight: 700;
  box-shadow: 0 8px 20px rgba(255, 117, 140, 0.45);
}
.tool-btn.primary:active {
  transform: scale(0.93);
  filter: brightness(1.08);
}

/* 라이트박스 팝업 */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(45, 52, 54, 0.45);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  padding: 24px;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.lightbox-card {
  max-width: 90vw;
  max-height: 82vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(20px);
  padding: 20px;
  border-radius: 28px;
  box-shadow: 0 25px 60px rgba(180, 140, 180, 0.4);
  border: 2px solid #fff;
}
.lightbox-img {
  max-width: 100%;
  max-height: 52vh;
  object-fit: contain;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}
.lightbox-cap {
  margin-top: 14px;
  font-family: var(--font-hand);
  font-size: 26px;
  color: #e056fd;
  text-align: center;
  font-weight: 700;
}
.lightbox-actions {
  display: flex;
  gap: 12px;
  margin-top: 16px;
}
.lb-btn {
  background: #f1f2f6;
  border: 1px solid #dfe4ea;
  color: #2f3542;
  font-weight: 600;
  padding: 9px 18px;
  border-radius: 20px;
  font-size: 14px;
  cursor: pointer;
}
.lb-btn.del { background: #ffeaa7; border-color: #fdcb6e; color: #d63031; }

/* 여행 리스트 모달 */
.sheet-modal {
  position: fixed;
  inset: 0;
  background: rgba(45, 52, 54, 0.35);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 10001;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.24s ease;
}
.sheet-modal.open { opacity: 1; pointer-events: auto; }
.sheet-content {
  background: #ffffff;
  border-top-left-radius: 28px;
  border-top-right-radius: 28px;
  padding: 22px 20px calc(24px + var(--safe-bottom));
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 -15px 40px rgba(200, 160, 200, 0.3);
  max-height: 82vh;
  display: flex;
  flex-direction: column;
}
.sheet-modal.open .sheet-content { transform: translateY(0); }
.sheet-header {
  color: #2d3436;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.sheet-close {
  background: #f1f2f6;
  border: none;
  color: #747d8c;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 15px;
  cursor: pointer;
}

.album-list {
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 4px 0 14px;
}
.album-card {
  background: #fafafa;
  border: 1.5px solid #f1f2f6;
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: all 0.18s;
}
.album-card.active {
  border-color: #ff758c;
  background: #fff5f7;
}
.album-card:active { transform: scale(0.98); }
.album-name { color: #2d3436; font-size: 16px; font-weight: 700; }
.album-meta { color: #8395a7; font-size: 12px; margin-top: 3px; }
.album-del-btn {
  background: none;
  border: none;
  color: #a4b0be;
  font-size: 18px;
  padding: 6px 10px;
  cursor: pointer;
}
.album-del-btn:active { color: #ff4757; }

.sheet-actions {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}
.btn-primary-action {
  flex: 1;
  background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
  color: #fff;
  border: none;
  border-radius: 16px;
  padding: 13px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(255, 117, 140, 0.4);
}
.btn-sub-action {
  flex: 1;
  background: #f1f2f6;
  color: #4b5563;
  border: none;
  border-radius: 16px;
  padding: 13px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

/* 카메라 플래시 */
#flashOverlay {
  position: fixed;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 99999;
  transition: opacity 0.4s ease-out;
}
#flashOverlay.flash { opacity: 0.95; transition: none; }
</style>
</head>
<body>

<div id="flashOverlay"></div>
<canvas id="sparkleCanvas"></canvas>

<header>
  <div class="album-badge-box" id="btnOpenAlbum">
    <span class="icon">✨</span>
    <span class="name" id="currentAlbumName">반짝이는 여행 순간</span>
    <span class="count" id="currentPhotoCount">0장</span>
  </div>
  <div class="header-actions">
    <button class="header-btn" id="btnSaveCurrent">💖 저장</button>
    <button class="header-btn" id="btnAutoSpin">🎠 자동회전</button>
  </div>
</header>

<div id="stage">
  <div class="aurora-orb orb-1"></div>
  <div class="aurora-orb orb-2"></div>
  <div class="aurora-orb orb-3"></div>

  <div class="turntable-crystal-base" id="turntableBase"></div>
  <div id="carousel"></div>

  <div id="emptyHint">
    <div class="icon">🔮</div>
    <p>아래 <b>+ 사진 추가</b>를 눌러</p>
    <p>크리스탈 턴테이블에 빛나는 추억을 담아보세요!</p>
  </div>
</div>

<div class="toolbar-wrap">
  <div class="nav-controls">
    <button class="nav-arrow" id="btnPrev">‹</button>
    <button class="nav-arrow" id="btnNext">›</button>
  </div>
  <div class="toolbar">
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
    <button class="tool-btn primary" id="btnAddPhoto">
      <span class="ico">✨</span>
      <span>+ 사진 추가</span>
    </button>
    <button class="tool-btn" id="btnAudioToggle">
      <span class="ico">🔔</span>
      <span id="audioLabel">오르골 ON</span>
    </button>
  </div>
</div>

<!-- 상세 라이트박스 -->
<div class="modal-overlay" id="lightboxModal">
  <div class="lightbox-card">
    <img class="lightbox-img" id="lightboxImg" src="" alt="detail">
    <div class="lightbox-cap" id="lightboxCap"></div>
    <div class="lightbox-actions">
      <button class="lb-btn del" id="btnDeletePhoto">이 사진 삭제</button>
      <button class="lb-btn" id="btnCloseLightbox">닫기</button>
    </div>
  </div>
</div>

<!-- 여행 리스트 모달 -->
<div class="sheet-modal" id="albumSheet">
  <div class="sheet-content">
    <div class="sheet-header">
      <span>내 크리스탈 턴테이블 리스트</span>
      <button class="sheet-close" id="btnCloseAlbumSheet">✕</button>
    </div>
    <div class="album-list" id="albumList"></div>
    <div class="sheet-actions">
      <button class="btn-primary-action" id="btnSaveAsNew">새 이름으로 저장</button>
      <button class="btn-sub-action" id="btnCreateBlank">새 턴테이블</button>
    </div>
  </div>
</div>

<script>
// ==========================================
// 1. 청량하고 영롱한 오르골/차임 사운드 신디사이저
// ==========================================
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// 맑은 오르골 차임벨 (회전 / 넘김 시)
const CHIME_FREQS = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C E G C E
let chimeIdx = 0;

function playMusicBoxChime() {
  if (!soundEnabled) return;
  initAudio();
  const now = audioCtx.currentTime;
  const freq = CHIME_FREQS[chimeIdx % CHIME_FREQS.length];
  chimeIdx++;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, now);

  gain.gain.setValueAtTime(0.25, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.6);
}

// 마법처럼 사진 등록 시 팅클 사운드
function playMagicSparkleSound() {
  if (!soundEnabled) return;
  initAudio();
  const now = audioCtx.currentTime;
  const notes = [659.25, 880, 1046.5, 1318.51, 1567.98];
  notes.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(f, now + i * 0.05);
    gain.gain.setValueAtTime(0.18, now + i * 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.35);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now + i * 0.05);
    osc.stop(now + i * 0.05 + 0.35);
  });
}

// ==========================================
// 2. 반짝이는 별가루 (Sparkle Particle) 효과
// ==========================================
const canvas = document.getElementById('sparkleCanvas');
const ctx = canvas.getContext('2d');
let sparkles = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Sparkle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2.5 + 1;
    this.alpha = Math.random() * 0.8 + 0.2;
    this.speed = Math.random() * 0.4 + 0.1;
    this.sparkleRate = Math.random() * 0.04 + 0.01;
  }
  update() {
    this.y -= this.speed;
    this.alpha += Math.sin(Date.now() * this.sparkleRate) * 0.02;
    if (this.y < 0) this.reset();
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = Math.max(0.1, Math.min(1, this.alpha));
    ctx.fillStyle = '#ff758c';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

for (let i = 0; i < 40; i++) sparkles.push(new Sparkle());

function renderSparkles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  sparkles.forEach(s => {
    s.update();
    s.draw();
  });
  requestAnimationFrame(renderSparkles);
}
requestAnimationFrame(renderSparkles);

// ==========================================
// 3. IndexedDB 영구 저장
// ==========================================
const DB_NAME = 'CrystalCarouselDB';
const DB_VERSION = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('albums')) {
        d.createObjectStore('albums', { keyPath: 'id' });
      }
    };
    req.onsuccess = e => {
      db = e.target.result;
      resolve(db);
    };
    req.onerror = e => reject(e);
  });
}

function getAllAlbums() {
  return new Promise(resolve => {
    if (!db) return resolve([]);
    const tx = db.transaction('albums', 'readonly');
    const req = tx.objectStore('albums').getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

function saveAlbum(album) {
  return new Promise(resolve => {
    if (!db) return resolve();
    const tx = db.transaction('albums', 'readwrite');
    tx.objectStore('albums').put(album);
    tx.oncomplete = () => resolve();
  });
}

function deleteAlbum(id) {
  return new Promise(resolve => {
    if (!db) return resolve();
    const tx = db.transaction('albums', 'readwrite');
    tx.objectStore('albums').delete(id);
    tx.oncomplete = () => resolve();
  });
}

// ==========================================
// 4. 상태 & 3D 턴테이블 렌더링
// ==========================================
let currentAlbum = {
  id: 'crystal_default',
  name: '반짝이는 여행 순간',
  updatedAt: Date.now(),
  photos: []
};

let currentRotation = 0;
let targetRotation = 0;
let isAutoSpin = false;
let activePhotoIndex = null;

const GEM_ICONS = ['💎', '💖', '✨', '🌸', '⭐', '🔮', '🎀', '🍬'];

const stage = document.getElementById('stage');
const carousel = document.getElementById('carousel');
const turntableBase = document.getElementById('turntableBase');
const emptyHint = document.getElementById('emptyHint');
const currentAlbumName = document.getElementById('currentAlbumName');
const currentPhotoCount = document.getElementById('currentPhotoCount');

function updateHeader() {
  currentAlbumName.textContent = currentAlbum.name;
  currentPhotoCount.textContent = `${currentAlbum.photos.length}장`;
  emptyHint.style.opacity = currentAlbum.photos.length === 0 ? '1' : '0';
}

function flashScreen() {
  const fl = document.getElementById('flashOverlay');
  fl.classList.add('flash');
  requestAnimationFrame(() => requestAnimationFrame(() => fl.classList.remove('flash')));
}

function renderCarousel() {
  carousel.innerHTML = '';
  const count = currentAlbum.photos.length;
  updateHeader();
  if (count === 0) return;

  const cardWidth = 230;
  const angleStep = 360 / count;
  const radius = Math.max(270, Math.round((cardWidth / 2) / Math.tan(Math.PI / count)) + 35);

  currentAlbum.photos.forEach((photo, idx) => {
    const angle = angleStep * idx;
    const card = document.createElement('div');
    card.className = 'carousel-card';
    card.dataset.index = idx;

    const gem = GEM_ICONS[idx % GEM_ICONS.length];

    card.innerHTML = `
      <div class="crystal-card-body">
        <div class="card-gem-pin">${gem}</div>
        <div class="card-img-wrap">
          <img class="card-img" src="${photo.src}" alt="photo">
        </div>
        <div class="card-caption" contenteditable="true" spellcheck="false">${photo.caption || ''}</div>
      </div>
    `;

    card.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;

    const cap = card.querySelector('.card-caption');
    cap.addEventListener('pointerdown', e => e.stopPropagation());
    cap.addEventListener('blur', () => {
      photo.caption = cap.innerText.trim();
      persistAlbum();
    });
    cap.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        cap.blur();
      }
    });

    card.addEventListener('click', (e) => {
      if (e.target.closest('.card-caption')) return;
      openLightbox(idx);
    });

    carousel.appendChild(card);
  });

  applyCarouselTransform();
}

function applyCarouselTransform() {
  carousel.style.transform = `rotateY(${currentRotation}deg)`;
  turntableBase.style.transform = `rotateX(80deg) rotateZ(${-currentRotation}deg)`;

  const count = currentAlbum.photos.length;
  if (!count) return;
  const angleStep = 360 / count;

  const cards = carousel.querySelectorAll('.carousel-card');
  cards.forEach((card, idx) => {
    const cardAngle = (angleStep * idx + currentRotation) % 360;
    const norm = (cardAngle + 360) % 360;
    const depth = Math.cos(norm * Math.PI / 180);

    // 화사한 블러 & 투명도 (어둡게 만들지 않고 뽀샤시하게 원근감 부여)
    const opacity = depth < 0 ? Math.max(0.35, 0.75 + depth * 0.45) : 1;
    card.style.opacity = opacity;
    card.style.filter = depth < 0 ? `blur(${Math.abs(depth) * 2}px) saturate(85%)` : 'none';
  });
}

function animateLoop() {
  if (isAutoSpin) {
    targetRotation += 0.32;
  }
  const diff = targetRotation - currentRotation;
  if (Math.abs(diff) > 0.05) {
    currentRotation += diff * 0.12;
    applyCarouselTransform();
  }
  requestAnimationFrame(animateLoop);
}
requestAnimationFrame(animateLoop);

// ==========================================
// 5. 모바일 터치 스와이프 제스처
// ==========================================
let isDragging = false;
let startX = 0;
let lastX = 0;
let dragVelocity = 0;

stage.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.card-caption') || e.target.closest('button')) return;
  isDragging = true;
  startX = e.clientX;
  lastX = e.clientX;
  dragVelocity = 0;
  if (isAutoSpin) toggleAutoSpin(false);
  stage.setPointerCapture(e.pointerId);
});

stage.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - lastX;
  lastX = e.clientX;
  dragVelocity = dx;
  targetRotation += dx * 0.45;
});

const handlePointerUp = () => {
  if (!isDragging) return;
  isDragging = false;
  targetRotation += dragVelocity * 1.5;
  snapToNearest();
  playMusicBoxChime();
};
stage.addEventListener('pointerup', handlePointerUp);
stage.addEventListener('pointercancel', handlePointerUp);

function snapToNearest() {
  const count = currentAlbum.photos.length;
  if (!count) return;
  const angleStep = 360 / count;
  const targetIndex = Math.round(-targetRotation / angleStep);
  targetRotation = -targetIndex * angleStep;
}

document.getElementById('btnPrev').addEventListener('click', () => rotateByStep(1));
document.getElementById('btnNext').addEventListener('click', () => rotateByStep(-1));

function rotateByStep(dir) {
  const count = currentAlbum.photos.length;
  if (!count) return;
  const angleStep = 360 / count;
  targetRotation += dir * angleStep;
  playMusicBoxChime();
}

function toggleAutoSpin(state) {
  isAutoSpin = typeof state === 'boolean' ? state : !isAutoSpin;
  const btn = document.getElementById('btnAutoSpin');
  btn.textContent = isAutoSpin ? '⏸️ 멈춤' : '🎠 자동회전';
}
document.getElementById('btnAutoSpin').addEventListener('click', () => toggleAutoSpin());

// ==========================================
// 6. 사진 추가 및 라이트박스
// ==========================================
const fileInput = document.getElementById('fileInput');
document.getElementById('btnAddPhoto').addEventListener('click', () => {
  initAudio();
  fileInput.click();
});

fileInput.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;

  flashScreen();
  playMagicSparkleSound();

  for (let i = 0; i < files.length; i++) {
    const dataUrl = await readFileAndResize(files[i]);
    currentAlbum.photos.push({
      id: 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
      src: dataUrl,
      caption: ''
    });
  }

  renderCarousel();
  persistAlbum();
  fileInput.value = '';
});

function readFileAndResize(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1200;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = (h * maxDim) / w; w = maxDim; }
          else { w = (w * maxDim) / h; h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

const lightboxModal = document.getElementById('lightboxModal');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxCap = document.getElementById('lightboxCap');

function openLightbox(idx) {
  activePhotoIndex = idx;
  const p = currentAlbum.photos[idx];
  if (!p) return;
  lightboxImg.src = p.src;
  lightboxCap.textContent = p.caption || '빛나는 여행 추억';
  lightboxModal.classList.add('open');
  playMusicBoxChime();
}

document.getElementById('btnCloseLightbox').addEventListener('click', () => {
  lightboxModal.classList.remove('open');
});
lightboxModal.addEventListener('click', e => {
  if (e.target === lightboxModal) lightboxModal.classList.remove('open');
});

document.getElementById('btnDeletePhoto').addEventListener('click', () => {
  if (activePhotoIndex === null) return;
  if (!confirm('이 사진을 삭제할까요?')) return;
  currentAlbum.photos.splice(activePhotoIndex, 1);
  lightboxModal.classList.remove('open');
  renderCarousel();
  persistAlbum();
});

// ==========================================
// 7. 여행 리스트 관리
// ==========================================
const albumSheet = document.getElementById('albumSheet');
const albumList = document.getElementById('albumList');

function persistAlbum() {
  currentAlbum.updatedAt = Date.now();
  saveAlbum(currentAlbum);
  localStorage.setItem('lastCrystalAlbumId', currentAlbum.id);
}

document.getElementById('btnSaveCurrent').addEventListener('click', () => {
  persistAlbum();
  playMusicBoxChime();
  alert(`'${currentAlbum.name}' 턴테이블이 안전하게 저장되었습니다 ✨`);
});

document.getElementById('btnOpenAlbum').addEventListener('click', async () => {
  initAudio();
  await refreshAlbumList();
  albumSheet.classList.add('open');
});
document.getElementById('btnCloseAlbumSheet').addEventListener('click', () => {
  albumSheet.classList.remove('open');
});

async function refreshAlbumList() {
  albumList.innerHTML = '';
  const albums = await getAllAlbums();
  if (!albums.length) {
    albumList.innerHTML = '<div style="color:#a4b0be; text-align:center; padding:20px;">저장된 여행 리스트가 없습니다.</div>';
    return;
  }
  albums.sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0));

  albums.forEach(alb => {
    const card = document.createElement('div');
    card.className = 'album-card' + (alb.id === currentAlbum.id ? ' active' : '');
    const pCount = (alb.photos || []).length;
    const dateStr = new Date(alb.updatedAt || Date.now()).toLocaleDateString('ko-KR', { month:'short', day:'numeric' });

    card.innerHTML = `
      <div>
        <div class="album-name">${alb.name}</div>
        <div class="album-meta">사진 ${pCount}장 · ${dateStr}</div>
      </div>
      <button class="album-del-btn" title="삭제">🗑️</button>
    `;

    card.addEventListener('click', e => {
      if (e.target.closest('.album-del-btn')) return;
      currentAlbum = alb;
      currentRotation = 0;
      targetRotation = 0;
      renderCarousel();
      persistAlbum();
      albumSheet.classList.remove('open');
      playMusicBoxChime();
    });

    card.querySelector('.album-del-btn').addEventListener('click', async e => {
      e.stopPropagation();
      if (!confirm(`'${alb.name}' 여행을 삭제할까요?`)) return;
      await deleteAlbum(alb.id);
      if (currentAlbum.id === alb.id) {
        currentAlbum = {
          id: 'album_' + Date.now(),
          name: '새로운 여행',
          updatedAt: Date.now(),
          photos: []
        };
        renderCarousel();
        persistAlbum();
      }
      refreshAlbumList();
    });

    albumList.appendChild(card);
  });
}

document.getElementById('btnSaveAsNew').addEventListener('click', () => {
  const newName = prompt('저장할 턴테이블 이름을 입력하세요:', currentAlbum.name);
  if (!newName || !newName.trim()) return;

  currentAlbum = {
    id: 'album_' + Date.now(),
    name: newName.trim(),
    updatedAt: Date.now(),
    photos: JSON.parse(JSON.stringify(currentAlbum.photos))
  };

  persistAlbum();
  renderCarousel();
  albumSheet.classList.remove('open');
  alert(`'${currentAlbum.name}'으로 저장되었습니다 ✨`);
});

document.getElementById('btnCreateBlank').addEventListener('click', () => {
  const name = prompt('새 턴테이블 이름을 입력하세요:', '새로운 여행');
  if (!name || !name.trim()) return;

  currentAlbum = {
    id: 'album_' + Date.now(),
    name: name.trim(),
    updatedAt: Date.now(),
    photos: []
  };

  currentRotation = 0;
  targetRotation = 0;
  persistAlbum();
  renderCarousel();
  albumSheet.classList.remove('open');
});

document.getElementById('btnAudioToggle').addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  document.getElementById('audioLabel').textContent = soundEnabled ? '오르골 ON' : '오르골 OFF';
  if (soundEnabled) initAudio();
});

// ==========================================
// 8. 초기화
// ==========================================
window.addEventListener('DOMContentLoaded', async () => {
  await openDB();
  const albums = await getAllAlbums();
  const lastId = localStorage.getItem('lastCrystalAlbumId');

  if (albums.length > 0) {
    const found = albums.find(a => a.id === lastId);
    currentAlbum = found || albums[0];
  } else {
    currentAlbum = {
      id: 'album_init_crystal',
      name: '반짝이는 여행 순간',
      updatedAt: Date.now(),
      photos: []
    };
    saveAlbum(currentAlbum);
  }

  renderCarousel();
});
</script>
